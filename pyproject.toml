[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snu-ai-frame-ordering"
version = "0.1.0"
description = "Offline frame ordering pipeline for SNU AI Challenge 2026"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "torch>=2.2",
  "transformers>=5.2",
  "accelerate>=0.30",
  "peft>=0.12",
  "bitsandbytes>=0.43",
  "safetensors>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]
